# NexusMiner Configuration File
# This configuration addresses zero-CPU utilization issues and provides
# streamlined single-worker setup with proper Nexus Node synchronization

# ======================================================================
# MINING SETTINGS
# ======================================================================

# Mining channel: 1 = Prime (CPU), 2 = Hash (GPU)
# Prime mining uses CPU resources for prime number hashing
channel=1

# Number of worker threads for mining
# Optimized for single-worker setup to ensure proper CPU utilization
# Adjust based on your system's hardware capabilities
worker_threads=1

# ======================================================================
# NETWORK SYNCHRONIZATION SETTINGS
# ======================================================================

# Wallet IP address for synchronization with Nexus Node
# Use localhost for local node connections
wallet_ip=127.0.0.1

# Local IP address for miner binding
# Should match wallet_ip for localhost connections
local_ip=127.0.0.1

# Primary mining port (Prime channel default)
port=9325

# Fallback port if primary fails (0 = auto-select)
fallback_port=0

# Connection timeout in seconds
timeout=30

# ======================================================================
# GENESIS HASH / PAYOUT ADDRESS
# ======================================================================

# Genesis hash for mining rewards (payment address)
# This should match the Nexus Node's synced blockchain genesis
# Leave empty to use genesis from logged-in wallet context
# Example: genesis_hash=8FJxzexVDUN5YiQYK4QjvfRNrAUym8FNu3B8Q2hQxAswPuJwbhWe2v4CZGexU6BYc
genesis_hash=

# Validate genesis hash against Nexus Node blockchain
# Ensures mining task assignment is properly configured
validate_genesis=true

# ======================================================================
# MINING TASK ASSIGNMENT
# ======================================================================

# Enable prime-number hashing for CPU mining
prime_hashing=true

# Mining mode: solo or pool
# Solo mining sends rewards directly to genesis address
mining_mode=solo

# Auto-reconnect on connection failure
auto_reconnect=true

# Minimum reconnect delay (milliseconds)
min_reconnect_delay=1000

# Maximum reconnect delay (milliseconds)
max_reconnect_delay=60000

# ======================================================================
# STATS AND DEBUGGING
# ======================================================================

# Enable verbose stats printer for monitoring worker activity
verbose_stats=true

# Stats reporting interval (seconds)
stats_interval=10

# Log hashrate information
log_hashrate=true

# Log level: debug, info, warn, error
log_level=info

# ======================================================================
# PERFORMANCE OPTIMIZATION
# ======================================================================

# CPU affinity for worker threads (leave empty for auto)
# Example: cpu_affinity=0,1,2,3
cpu_affinity=

# Thread priority: low, normal, high
# Note: 'high' may require elevated privileges
thread_priority=normal

# Enable CPU optimizations for prime testing
cpu_optimizations=true
